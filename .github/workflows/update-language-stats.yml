name: Update language stats

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 09:17 UTC
    - cron: "17 9 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate language statistics
        env:
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          MAX_LANGUAGES: "6"

          # Optional, comma-separated:
          # EXCLUDED_REPOS: "old-test-repo,username/another-repo"

        run: python .github/scripts/generate_language_stats.py
     
      - name: Commit updated statistics
        run: |
          git add assets/language-stats.svg

          if git diff --cached --quiet; then
            echo "Language statistics have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update language stats"
          git push
